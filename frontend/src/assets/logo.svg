<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fbe8bb" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fbe8bb" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left S2C Hexagonal Icon with Stars -->
  <g transform="translate(60, 60) scale(0.48)">
    <!-- Top 3 Stars -->
    <polygon points="0,-102 3,-93 12,-93 5,-87 8,-78 0,-83 -8,-78 -5,-87 -12,-93 -3,-93" fill="url(#goldBrandGrad)" filter="url(#brandGlow)" />
    <polygon points="-16,-90 -14,-84 -8,-84 -13,-80 -11,-74 -16,-77 -21,-74 -19,-80 -24,-84 -18,-84" fill="url(#goldBrandGrad)" opacity="0.9" />
    <polygon points="16,-90 18,-84 24,-84 19,-80 21,-74 16,-77 11,-74 13,-80 8,-84 14,-84" fill="url(#goldBrandGrad)" opacity="0.9" />

    <!-- Hexagon Frame & Interlocking S 2 Emblem -->
    <path d="M 0 -68 L 52 -38 L 52 38 L 0 68 L -52 38 L -52 -38 Z" fill="#180b27" stroke="url(#goldBrandGrad)" stroke-width="7" stroke-linejoin="round" filter="url(#brandGlow)" />
    <line x1="0" y1="-64" x2="0" y2="64" stroke="url(#goldBrandGrad)" stroke-width="5.5" stroke-linecap="round" />

    <!-- Stylized Left 'S' Path -->
    <path d="M -7 -46 L -34 -30 L -34 -10 L -7 6 L -7 26 L -34 10 L -34 30 L -7 46" fill="none" stroke="url(#goldBrandGrad)" stroke-width="6.5" stroke-linecap="square" />
    <line x1="-34" y1="-10" x2="-14" y2="-21" stroke="url(#goldBrandGrad)" stroke-width="5.5" stroke-linecap="square" />

    <!-- Stylized Right '2' Path -->
    <path d="M 7 -46 L 34 -30 L 34 -10 L 7 6 L 34 22 L 34 30 L 7 46" fill="none" stroke="url(#goldBrandGrad)" stroke-width="6.5" stroke-linecap="square" />
    <line x1="14" y1="-21" x2="34" y2="-10" stroke="url(#goldBrandGrad)" stroke-width="5.5" stroke-linecap="square" />

    <!-- Bottom 3 Stars -->
    <polygon points="0,78 3,87 12,87 5,93 8,102 0,97 -8,102 -5,93 -12,87 -3,87" fill="url(#goldBrandGrad)" filter="url(#brandGlow)" />
    <polygon points="-16,74 -14,80 -8,80 -13,84 -11,90 -16,87 -21,90 -19,84 -24,80 -18,80" fill="url(#goldBrandGrad)" opacity="0.9" />
    <polygon points="16,74 18,80 24,80 19,84 21,90 16,87 11,90 13,84 8,80 14,80" fill="url(#goldBrandGrad)" opacity="0.9" />
  </g>

  <!-- Brand Typography -->
  <!-- "S2C" -->
  <text x="125" y="65" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="50" font-weight="900" letter-spacing="2" fill="url(#goldBrandGrad)" filter="url(#brandGlow)">
    S2C
  </text>
  
  <!-- "CRACKERS" -->
  <text x="240" y="65" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" letter-spacing="4" fill="#ffffff">
    CRACKERS
  </text>

  <!-- Tagline Subtitle -->
  <g transform="translate(127, 86)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="url(#goldBrandGrad)" stroke-width="1.5" opacity="0.4" />
    <text x="0" y="16" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="4.5" fill="#f59e0b">
      SIVAKASI DIRECT FACTORY FIREWORKS
    </text>
    <polygon points="384,10 387,17 395,17 389,21 391,28 384,24 377,28 379,21 373,17 381,17" fill="#ef4444" />
  </g>
</svg>
