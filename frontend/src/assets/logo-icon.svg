<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="40%" stop-color="#fbe8bb" />
      <stop offset="70%" stop-color="#f5d07b" />
      <stop offset="100%" stop-color="#d49e35" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group centered in viewBox -->
  <g transform="translate(100, 120)">
    <!-- Top 3 Stars -->
    <!-- Center Top Star (Large) -->
    <polygon points="0,-102 3,-93 12,-93 5,-87 8,-78 0,-83 -8,-78 -5,-87 -12,-93 -3,-93" fill="url(#goldLinear)" filter="url(#softGlow)" />
    <!-- Left Top Star (Small) -->
    <polygon points="-16,-90 -14,-84 -8,-84 -13,-80 -11,-74 -16,-77 -21,-74 -19,-80 -24,-84 -18,-84" fill="url(#goldLinear)" opacity="0.9" />
    <!-- Right Top Star (Small) -->
    <polygon points="16,-90 18,-84 24,-84 19,-80 21,-74 16,-77 11,-74 13,-80 8,-84 14,-84" fill="url(#goldLinear)" opacity="0.9" />

    <!-- Hexagon Frame & Interlocking S 2 Emblem -->
    <!-- Outer Hexagonal Stroke -->
    <path d="M 0 -68 L 52 -38 L 52 38 L 0 68 L -52 38 L -52 -38 Z" fill="none" stroke="url(#goldLinear)" stroke-width="8" stroke-linejoin="round" filter="url(#softGlow)" />

    <!-- Central Vertical Divider -->
    <line x1="0" y1="-64" x2="0" y2="64" stroke="url(#goldLinear)" stroke-width="6" stroke-linecap="round" />

    <!-- Stylized Left 'S' Path -->
    <path d="M -8 -48 L -36 -32 L -36 -10 L -8 6 L -8 28 L -36 12 L -36 32 L -8 48" fill="none" stroke="url(#goldLinear)" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" />
    <line x1="-36" y1="-10" x2="-16" y2="-21" stroke="url(#goldLinear)" stroke-width="6" stroke-linecap="square" />

    <!-- Stylized Right '2' Path -->
    <path d="M 8 -48 L 36 -32 L 36 -12 L 8 4 L 36 20 L 36 32 L 8 48" fill="none" stroke="url(#goldLinear)" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" />
    <line x1="16" y1="-21" x2="36" y2="-12" stroke="url(#goldLinear)" stroke-width="6" stroke-linecap="square" />

    <!-- Bottom 3 Stars -->
    <!-- Center Bottom Star (Large) -->
    <polygon points="0,78 3,87 12,87 5,93 8,102 0,97 -8,102 -5,93 -12,87 -3,87" fill="url(#goldLinear)" filter="url(#softGlow)" />
    <!-- Left Bottom Star (Small) -->
    <polygon points="-16,74 -14,80 -8,80 -13,84 -11,90 -16,87 -21,90 -19,84 -24,80 -18,80" fill="url(#goldLinear)" opacity="0.9" />
    <!-- Right Bottom Star (Small) -->
    <polygon points="16,74 18,80 24,80 19,84 21,90 16,87 11,90 13,84 8,80 14,80" fill="url(#goldLinear)" opacity="0.9" />
  </g>
</svg>
