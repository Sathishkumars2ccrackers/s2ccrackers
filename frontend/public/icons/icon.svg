<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pwaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#pwaBg)" stroke="#f97316" stroke-width="6" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)" />

  <!-- Center Hexagon & Stars -->
  <g transform="translate(256, 210) scale(1.65)">
    <!-- Top 3 Stars -->
    <polygon points="0,-85 2.5,-77 10,-77 4,-72 6.5,-64 0,-68 -6.5,-64 -4,-72 -10,-77 -2.5,-77" fill="url(#pwaGold)" filter="url(#pwaGlow)" />
    <polygon points="-14,-75 -12,-70 -7,-70 -11,-67 -9.5,-62 -14,-64.5 -18.5,-62 -17,-67 -21,-70 -16,-70" fill="url(#pwaGold)" opacity="0.9" />
    <polygon points="14,-75 16,-70 21,-70 17,-67 18.5,-62 14,-64.5 9.5,-62 11,-67 7,-70 12,-70" fill="url(#pwaGold)" opacity="0.9" />

    <!-- Hexagon Frame & Interlocking S 2 Emblem -->
    <path d="M 0 -54 L 42 -30 L 42 30 L 0 54 L -42 30 L -42 -30 Z" fill="#180b27" stroke="url(#pwaGold)" stroke-width="7" stroke-linejoin="round" filter="url(#pwaGlow)" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="url(#pwaGold)" stroke-width="5" stroke-linecap="round" />

    <!-- Stylized Left 'S' Path -->
    <path d="M -6 -36 L -26 -24 L -26 -8 L -6 4 L -6 20 L -26 8 L -26 24 L -6 36" fill="none" stroke="url(#pwaGold)" stroke-width="6" stroke-linecap="square" />
    <line x1="-26" y1="-8" x2="-10" y2="-16" stroke="url(#pwaGold)" stroke-width="5" stroke-linecap="square" />

    <!-- Stylized Right '2' Path -->
    <path d="M 6 -36 L 26 -24 L 26 -8 L 6 4 L 26 16 L 26 24 L 6 36" fill="none" stroke="url(#pwaGold)" stroke-width="6" stroke-linecap="square" />
    <line x1="10" y1="-16" x2="26" y2="-8" stroke="url(#pwaGold)" stroke-width="5" stroke-linecap="square" />

    <!-- Bottom 3 Stars -->
    <polygon points="0,62 2.5,70 10,70 4,75 6.5,83 0,79 -6.5,83 -4,75 -10,70 -2.5,70" fill="url(#pwaGold)" filter="url(#pwaGlow)" />
    <polygon points="-14,59 -12,64 -7,64 -11,67 -9.5,72 -14,69.5 -18.5,72 -17,67 -21,64 -16,64" fill="url(#pwaGold)" opacity="0.9" />
    <polygon points="14,59 16,64 21,64 17,67 18.5,72 14,69.5 9.5,72 11,67 7,64 12,64" fill="url(#pwaGold)" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="256" y="415" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#ffffff">
    S2C CRACKERS
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="8" fill="#f97316">
    ADMIN CONTROL
  </text>
</svg>
