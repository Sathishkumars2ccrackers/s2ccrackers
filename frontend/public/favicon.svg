    <polygon points="0,-95 3,-86 12,-86 5,-80 8,-71 0,-76 -8,-71 -5,-80 -12,-86 -3,-86" fill="url(#favGold)" />
    <polygon points="-16,-83 -14,-77 -8,-77 -13,-73 -11,-67 -16,-70 -21,-67 -19,-73 -24,-77 -18,-77" fill="url(#favGold)" opacity="0.9" />
    <polygon points="16,-83 18,-77 24,-77 19,-73 21,-67 16,-70 11,-67 13,-73 8,-77 14,-77" fill="url(#favGold)" opacity="0.9" />

