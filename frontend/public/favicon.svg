    <polygon points="-16,67 -14,73 -8,73 -13,77 -11,83 -16,80 -21,83 -19,77 -24,73 -18,73" fill="url(#favGold)" opacity="0.9" />
    <polygon points="16,67 18,73 24,73 19,77 21,83 16,80 11,83 13,77 8,73 14,73" fill="url(#favGold)" opacity="0.9" />
